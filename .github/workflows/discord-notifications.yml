name: Discord Notifications

on:
  push:

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          AUTHOR_NAME="${GITHUB_ACTOR}"
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          COMMIT_MSG=$(git log -1 --pretty=%s "${GITHUB_SHA}" 2>/dev/null || echo "N/A")

          if [ -n "${GITHUB_EVENT_BEFORE}" ]; then
            FILES_CHANGED=$(git diff --name-only "${GITHUB_EVENT_BEFORE}" "${GITHUB_SHA}" 2>/dev/null | sed 's/^/  - /' || echo "N/A")
          else
            FILES_CHANGED=$(git show --name-only --pretty=format:"" "${GITHUB_SHA}" 2>/dev/null | sed 's/^/  - /' || echo "N/A")
          fi

          if [ ${#FILES_CHANGED} -gt 1000 ]; then
            FILES_CHANGED=$(echo "${FILES_CHANGED}" | head -c 1000)
          fi

          SHA_SHORT="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          python3 .github/workflows/send_discord.py "${BRANCH_NAME}" "${COMMIT_MSG}" "${AUTHOR_NAME}" "${FILES_CHANGED}" "${SHA_SHORT}" "${TIMESTAMP}"

          curl -X POST "${DISCORD_WEBHOOK}" -H "Content-Type: application/json" -d @payload.json
