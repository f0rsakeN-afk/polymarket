name: CI

# These workflows used to live in `backend/.github/workflows/`, where GitHub
# never looked at them — so CI had never actually run. They now live at the
# repository root, which is the only place Actions reads from.
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # conftest.py falls back to these when backend/.env is absent (it is
      # gitignored, so a fresh checkout never has one).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
      POSTGRES_PORT: "5433"
      # Empty password → conftest builds an unauthenticated Redis URL.
      REDIS_PASSWORD: ""
      REDIS_PORT: "6380"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: change-me
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      # --frozen: fail if pyproject.toml and uv.lock disagree, so a dependency
      # edit that was never locked can't reach main.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check app tests

      # conftest.py builds `mydatabase_test` from `alembic upgrade head` on
      # every run, so migrations are exercised by the test suite itself.
      # --cov-fail-under is the measured baseline (72.5% at time of writing);
      # ratchet it up, never down.
      - name: Run tests with pytest
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-fail-under=65

  frontend:
    name: Frontend — eslint + tsc (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint with eslint
        run: bun run lint

      # Scoped to apps/web: the shared `@workspace/ui` package still has type
      # errors in the chart internals (see docs/README.md gap list) and is not
      # part of the gate yet.
      - name: Type-check apps/web
        working-directory: frontend/apps/web
        run: bun run typecheck

  security-scan:
    name: Trivy scan (reports, does not block)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan dependencies and source
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: "."
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      # Dockerfiles, compose files and workflow misconfiguration.
      - name: Scan configuration
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: "."
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"

      # Uploads are best-effort: code scanning needs GitHub Advanced Security
      # on private repositories, and a missing plan must not fail CI.
      - name: Upload findings to the Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload configuration findings
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
