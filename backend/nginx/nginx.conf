worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 10240;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time ufl=$upstream_fact_addr';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ─────────────────────────────────────────────────────────
    sendfile   on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Rate Limiting Zones ─────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ── Upstreams ───────────────────────────────────────────────────────────
    # FastAPI instances — 4 containers × 4 workers = 16 total workers
    upstream api_backend {
        least_conn;  # prefer least loaded
        server api1:8000;
        server api2:8000;
        server api3:8000;
        server api4:8000;
        keepalive 32;
    }

    # ── Server ─────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security Headers ─────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection      "1; mode=block" always;
        add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

        # ── Health Check ──────────────────────────────────────────────────
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # ── REST API ──────────────────────────────────────────────────────
        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long API calls
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Caching
            proxy_cache_bypass $http_upgrade;
        }

        # ── WebSocket (sticky via IP) ──────────────────────────────────────
        # WebSocket connections must route to the same backend for the
        # duration of the session (in-memory state per worker).
        # 50k concurrent WS → 50k / 4 containers = ~12.5k per instance
        location /ws/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            # WebSocket headers
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts for WS keepalive
            proxy_connect_timeout 7d;
            proxy_send_timeout    7d;
            proxy_read_timeout    7d;

            # Disable buffering — critical for WS
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
