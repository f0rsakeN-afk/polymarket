name: polymarket-backend-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${BACKEND_PORT:-6000}:8000"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-polymarket}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-6380}/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-6380}/1
      RATE_LIMIT_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - celery
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-polymarket}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-6380}/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-6380}/1
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - celery
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-polymarket}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-6380}/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-6380}/1
    command: celery -A app.workers.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
