services:
  # ── Nginx reverse proxy / load balancer ───────────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      api:
        condition: service_healthy
    health_check:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    sysctls:
      - net.core.somaxconn=65535
    deploy:
      resources:
        limits:
          nofile: 65536
    networks:
      - backend

  # ── FastAPI — scales horizontally ───────────────────────────────────────
  api:
    build: .
    env_file:
      - .env
    health_check:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    env:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    deploy:
      replicas: 4
      resources:
        limits:
          nofile: 65536
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
    networks:
      - backend

  # ── Celery worker — processes background tasks ─────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      uv run celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=8
      --max-tasks-per-child=500
      --prefetch-multiplier=1
    deploy:
      replicas: 2
      resources:
        limits:
          nofile: 65536
          memory: 1G
    networks:
      - backend

  # ── Celery beat — task scheduler ──────────────────────────────────────────
  celery_beat:
    build: .
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uv run celery -A app.workers.celery_app beat --loglevel=info
    networks:
      - backend

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_NAME:-mydatabase}
      # Tuning for 50k connections
      POSTGRES_MAX_CONNECTIONS: 500
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 768MB
      POSTGRES_WORK_MEM: 8MB
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: 0.9
      POSTGRES_WAL_BUFFERS: 16MB
      POSTGRES_DEFAULT_STATS_TARGET: 100
      POSTGRES_RANDOM_PAGE_COST: 1.1
      POSTGRES_EFFECTIVE_IO_CONCURRENCY: 200
      POSTGRES_MAX_WAL_SIZE: 1GB
      POSTGRES_MIN_WAL_SIZE: 256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5435:5432"
    health_check:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myuser} -d ${DB_NAME:-mydatabase}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - backend

  # ── Redis — cache, pub/sub, Celery broker ────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
      --tcp-backlog 65536
    volumes:
      - redis_data:/data
    ports:
      - "6382:6379"
    health_check:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - backend

  # ── Redis replica — read scaling for pub/sub fan-out ─────────────────────
  # For >10k WS connections, add Redis Sentinel or cluster
  # redis_replica:
  #   image: redis:7-alpine
  #   command: redis-server --replicaof redis 6379 --maxmemory 512mb --maxmemory-policy allkeys-lru
  #   volumes:
  #     - redis_replica_data:/data
  #   ports:
  #     - "6383:6379"
  #   restart: unless-stopped
  #   networks:
  #     - backend

networks:
  backend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br_backend
      com.docker.network.bridge.max_receiving_buffer_bytes: 16777216
      com.docker.network.bridge.max_sending_buffer_bytes: 16777216

volumes:
  postgres_data:
  redis_data:
