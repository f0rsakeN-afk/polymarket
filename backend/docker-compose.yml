# Local development — hot-reload, uses existing postgres (5433) and redis (6380) on the host.
# Reads defaults from .env — override values there or export env vars before running.
# Usage: docker compose up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "6000:8000"
    # Mount ONLY the app source dir — keeps .venv from the image intact
    volumes:
      - ./app:/app/app:rw
      - ./migrations:/app/migrations:rw
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-polymarket}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-6380}/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-6380}/1
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    command: uvicorn app.app:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"
    security_opt:
      - no-new-privileges:true

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - celery
    volumes:
      - ./app:/app/app:rw
      - ./migrations:/app/migrations:rw
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-polymarket}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-6380}/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-6380}/1
    command: celery -A app.tasks worker --loglevel=info --concurrency=1
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - celery
    volumes:
      - ./app:/app/app:rw
      - ./migrations:/app/migrations:rw
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-polymarket}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-6380}/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@host.docker.internal:${REDIS_PORT:-6380}/1
    command: celery -A app.tasks beat --loglevel=info
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
