[project]
name = "backend"
version = "0.1.0"
description = "Polymarket-style prediction market"
readme = "README.md"
requires-python = ">=3.13.0"

dependencies = [
    # Web
    "fastapi>=0.139.2",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
    # Database
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    # Redis
    "redis>=5.0.0",
    # Celery
    "celery>=5.4.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pyotp>=2.9.0",
    # Utilities
    "python-multipart>=0.0.9",
    "stripe>=10.0.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",
    "bcrypt>=5.0.0",
    "psycopg2-binary>=2.9.12",
    "resend>=0.8.0",
    "ruff>=0.9.0",
    "pyright>=1.1.300",
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
exclude = ["migrations/", ".venv/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "BLE", "FURB"]
ignore = ["E501", "S110", "BLE001", "S311"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S311", "S608", "S106"]
"migrations/*" = ["ALL"]
"app/config.py" = ["S105", "S106"]

reportGeneralTypeIssues.enabled = false

[tool.pyright.reportAttributeAccessIssue]
enabled = false
