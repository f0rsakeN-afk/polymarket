# Production deployment template
# Copy to deploy/docker-compose.yml and fill in .env values
#
# Required env vars (set in CI/CD secrets / .env):
#   DEPLOY_HOST           - public domain (e.g. api.example.com)
#   POSTGRES_HOST         - PostgreSQL host
#   POSTGRES_DB           - database name
#   POSTGRES_USER         - database user
#   POSTGRES_PASSWORD     - database password
#   REDIS_SENTINEL_HOSTS  - comma-separated sentinel hosts (e.g. "sentinel1:26379,sentinel2:26379")
#   REDIS_PASSWORD        - Redis/Sentinel password
#   SECRET_KEY            - FastAPI secret key (32+ chars)
#   ALGORITHM             - JWT algorithm (default: HS256)
#   SSL_EMAIL             - Let's Encrypt email for nginx
#   IMAGE                 - Docker image tag (set by CI/CD, e.g. ghcr.io/owner/polymarket-backend:<sha>)

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  app:
    image: ${IMAGE:?IMAGE must be set}
    restart: unless-stopped
    user: appuser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_SENTINEL_HOSTS: ${REDIS_SENTINEL_HOSTS}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: >
      gunicorn app.app:app
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --keep-alive 5
      --access-logfile -
      --error-logfile -
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  celery_worker:
    image: ${IMAGE:?IMAGE must be set}
    restart: unless-stopped
    user: appuser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_SENTINEL_HOSTS: ${REDIS_SENTINEL_HOSTS}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    command: celery -A app.tasks worker --loglevel=info --concurrency=4
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"

  celery_beat:
    image: ${IMAGE:?IMAGE must be set}
    restart: unless-stopped
    user: appuser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_SENTINEL_HOSTS: ${REDIS_SENTINEL_HOSTS}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    command: celery -A app.tasks beat --loglevel=info
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-polymarket}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
    profiles:
      - database  # start with: docker-compose --profile database up

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --sentinel-announce-ip ${REDIS_SENTINEL_HOSTS:-localhost}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    profiles:
      - database

volumes:
  pgdata:
