# Prometheus configuration.
#
# This exists because the application exposes /metrics and nothing was reading
# it. Every number the realtime work relies on - dropped frames, queue depth,
# Redis publish failures - was instrumented and then ignored, which is the same as
# not having instrumented it: the cascade the backpressure queue exists to prevent
# would have happened invisibly, and the only evidence would have been a log line
# nobody was watching.
#
# Scraped through the ingress-agnostic service name, so this works the same
# whether the app is behind a proxy, in compose, or on Kubernetes.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: predictx

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: predictx-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
    # The gateway fans out inside a single process, so one scrape target covers
    # every socket on that worker. Multiprocess mode aggregates the per-worker
    # files into one response - see PROMETHEUS_MULTIPROC_DIR in the compose file.
    honor_labels: true

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]