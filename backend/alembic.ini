[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# NOTE: migrations/env.py always overwrites this from app.config.settings.database_url,
# which reads the DATABASE_URL environment variable — no credentials are hardcoded here.
# Keep it empty so a stray `alembic` invocation can never silently target a
# different database than the application does.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
