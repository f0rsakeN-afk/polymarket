name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type-check with mypy
        run: uv run mypy .

      - name: Run tests with pytest
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --junitxml=test-results/results.xml

      - name: Check coverage
        run: |
          TOTAL=$(uv run coverage xml --quiet && python -c "
import re, sys
with open('coverage.xml') as f:
    m = re.search(r'line-rate=\"([0-9.]+)\"', f.read())
    print(int(float(m.group(1)) * 100) if m else 0)
")
          echo "Coverage: ${TOTAL}%"
          if [ "$TOTAL" -lt 80 ]; then echo "Coverage ${TOTAL}% is below 80% threshold"; exit 1; fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
