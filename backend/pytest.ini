[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Ensure `app` package is importable when running pytest from the backend dir
pythonpath = .
# e2e_api_test.py is a standalone script for a *live* stack (python e2e_api_test.py
# against localhost:8000) • its tests fail without a running server, so keep it out
# of the unit/integration run. Run it explicitly when the stack is up.
addopts = --ignore=e2e_api_test.py

# Starlette BaseHTTPMiddleware + asyncpg: task cancellation during exception handling
# leaves Connection._cancel unawaited • a known starlette/asyncpg interaction, not our bug
# starlette.testclient uses httpx which is deprecated • test infrastructure only, not our code
filterwarnings =
    ignore:.*coroutine.*was never awaited:RuntimeWarning
    ignore:.*httpx.*with.*starlette.*testclient.*deprecated
