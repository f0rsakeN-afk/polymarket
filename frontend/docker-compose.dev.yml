services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8000
      - NEXT_PUBLIC_WS_URL=ws://host.docker.internal:8000
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # The operator tool, on its own port.
  #
  # A separate service rather than a second port on `web`, so it can be stopped,
  # restarted or resource-limited without touching the storefront — an operator
  # tool on a box that is out of memory should take the operator tool down, not
  # the site.
  #
  # `NEXT_PUBLIC_SITE_URL` is what the admin gate sends a non-admin to. Without it
  # the link points at the API origin, which is a confusing dead end rather than
  # the storefront the operator came from.
  admin:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./apps/admin:/app/apps/admin
      - ./packages:/app/packages
      # The anonymous volumes matter: without them the host's `node_modules`
      # shadow the image's, and a native build for the wrong platform fails at
      # `next build` with an error about a missing binding.
      - /app/apps/admin/node_modules
      - /app/packages/ui/node_modules
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8000
      - NEXT_PUBLIC_WS_URL=ws://host.docker.internal:8000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    # Same shape as the image's own CMD, with the filter swapped. No PORT: the
    # admin app's dev script is `next dev -p 3001`, and a PORT env var that
    # disagrees with an explicit `-p` is one more place for the two to diverge.
    command: ["bunx", "turbo", "dev", "--filter=admin", "--host", "0.0.0.0"]
    deploy:
      resources:
        limits:
          # Deliberately smaller than web. There is one operator at a time, there
          # is no realtime socket, and no market feed to keep in memory.
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "256M"