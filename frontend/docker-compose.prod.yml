services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      # `templates/`, not `conf.d/`: this is what makes `${ADMIN_SERVER_NAME}`
      # substitutable. Files in conf.d/ are copied verbatim and a literal
      # `${...}` there is a startup failure, not a default.
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - nginx-logs:/var/log/nginx
      - nginx-cache:/var/cache/nginx
    environment:
      # Defaults to `_`, which leaves the storefront as the default vhost. Set it
      # to the real admin hostname in the deployment environment.
      - ADMIN_SERVER_NAME=${ADMIN_SERVER_NAME:-_}
    depends_on:
      web:
        condition: service_healthy
      # Nginx must not start and serve 502s for the admin surface: a rolling
      # restart that leaves the operator tool down is a worse outcome than one
      # that leaves the *storefront* briefly degraded.
      admin:
        condition: service_healthy
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "256M"
        reservations:
          cpus: "0.25"
          memory: "64M"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "256M"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # The operator tool.
  #
  # Same image as `web`, different root. A separate *service* is the point: it can
  # be stopped, restarted or resource-limited on its own, and nginx routes to it
  # separately - which is what lets the admin surface be put behind an extra
  # network policy later without touching the storefront.
  #
  # Not published to the host (`expose`, not `ports`). The only thing that should
  # reach it is nginx, and a published port is one fewer thing between the internet
  # and an operator surface that already exists to do damage.
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      # Baked into the bundle at build time, so it must be a build arg as well -
      # the admin gate uses it to send a non-admin to the storefront. Set to the
      # *storefront's* public origin, not the API's.
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    working_dir: /app/admin/apps/admin
    command: ["node", "server.js"]
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          # Smaller than web, and it stays that way on purpose: there is no
          # market feed and no websocket, so an admin container asking for the
          # storefront's budget is a misconfiguration, not a peak.
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=50M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/login"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  frontend:
    driver: bridge
  backend:
    external: true

volumes:
  nginx-logs:
  nginx-cache:
